tosca_definitions_version: 2.0
node_types:
  Database:
    description: "An abstract node type for all databases"
    properties:
      testProperty:
        description: >-
          Identifies the virtualization environments (e.g. hypervisor) compatible with this software
          image.
        type: integer
        validation: { $less_or_equal: [ $value, 500 ] }

  WebApplication:
    description: >-
      The File artifact type is used when an artifact definition needs
      to have its associated file simply treated as a file without any
      special handling.
    derived_from: Database
    requirements: 
      - provides_endpoint:
            capability: Endpoint
            node: add_service_location
            relationship: cna-modeling.relationships.Provides.Endpoint
      - provides_endpoint11:
            capability: Endpoint
            node: add_service_location
            relationship: cna-modeling.relationships.Provides.Endpoint
   
  File1:
    description: >-
      The File artifact type is used when an artifact definition needs
      to have its associated file simply treated as a file without any
      special handling.
    derived_from: Database
